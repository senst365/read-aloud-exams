<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1f2933; --accent:#1f3b57; --line:#d9e0e7; }

  body { margin:0; background:var(--bg); color:var(--text); font-family:"Microsoft JhengHei","PingFang TC",sans-serif; }
  main { max-width:560px; margin:40px auto; padding:0 16px; }
  h1 { font-size:26px; margin:0 0 6px; }

  a { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px;

</style>
